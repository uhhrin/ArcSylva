require-axe: true
sneak-to-disable: true
confirm-modified-trees: true
confirmations:
  timeout: 8
limits:
  max-blocks-per-tree: 64
  blocks-per-tick: 12
  scan-timeout-ms: 100
detection:
  min-vertical-logs: 2
  leaf-search-radius: 4
  min-natural-leaves: 1
  allowed-log-types:
    - OAK_LOG
    - BIRCH_LOG
    - SPRUCE_LOG
    - JUNGLE_LOG
    - ACACIA_LOG
    - DARK_OAK_LOG
    - MANGROVE_LOG
    - CHERRY_LOG
    - CRIMSON_STEM
    - WARPED_STEM
    - STRIPPED_OAK_LOG
    - STRIPPED_BIRCH_LOG
    - STRIPPED_SPRUCE_LOG
    - STRIPPED_JUNGLE_LOG
    - STRIPPED_ACACIA_LOG
    - STRIPPED_DARK_OAK_LOG
    - STRIPPED_MANGROVE_LOG
    - STRIPPED_CHERRY_LOG
    - STRIPPED_CRIMSON_STEM
    - STRIPPED_WARPED_STEM
features:
  replant-sapling: true
  drop-saplings: true
  apply-fortune: true
  apply-durability: true
  durability-multiplier: 1.0
enabled-worlds: []
